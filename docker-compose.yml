services:
  postgres:
    image: postgres:16-alpine
    container_name: votacion-electivos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: votacion
      POSTGRES_PASSWORD: votacion
      POSTGRES_DB: votacion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votacion -d votacion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
